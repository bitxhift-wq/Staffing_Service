<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />

    <!-- Favicon & Brand Icons -->
    <link rel="icon" type="image/png" href="/images/staffing/emblem.png" />
    <link rel="apple-touch-icon" href="/images/staffing/emblem.png" />

    <!-- Preload critical LCP assets: navbar brand logo and hero image (responsive) -->
    <link rel="preload" as="image" href="/assets/Smrikaam_Workforce_Logo_Transparent.svg" type="image/svg+xml" fetchpriority="high" />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/staffing/hero-interview-1200.webp"
      imagesrcset="/images/staffing/hero-interview-800.webp 800w, /images/staffing/hero-interview-1200.webp 1200w, /images/staffing/hero-interview-1600.webp 1600w, /images/staffing/hero-interview.webp 2400w"
      imagesizes="(max-width: 1024px) 100vw, 50vw"
      fetchpriority="high"
    />

    <!-- Typography & Performance Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=Oswald:wght@600;700;800&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!--
      SEO head (title, description, canonical, Open Graph, Twitter Card, JSON-LD, analytics)
      is generated from src/seo.ts by the Vite plugin in vite.config.ts and by scripts/prerender.js.
      Edit the SEO content in src/seo.ts only.
    -->
    <!--seo:head-->
  </head>
  <body>
    <!--seo:body-->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
